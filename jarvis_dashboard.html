<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS // Neural Architecture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #040814; /* Deep technical blue/black from the image */
            overflow: hidden;
            font-family: 'JetBrains Mono', monospace;
            color: #e2e8f0;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        /* Minimal panels so they don't block the beautiful network */
        .panel {
            background: rgba(4, 8, 20, 0.7);
            border: 1px solid rgba(100, 150, 255, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 4px;
            pointer-events: auto;
        }

        .text-glow {
            text-shadow: 0 0 8px rgba(255, 170, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- Dense Neural Network Canvas -->
    <canvas id="networkCanvas"></canvas>

    <!-- Minimal Overlay -->
    <div class="ui-overlay">
        <header class="flex justify-between items-start">
            <div class="panel px-4 py-2 flex items-center gap-3">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <div>
                    <div class="text-xs text-blue-300">SYSTEM.STATUS</div>
                    <div class="text-sm font-bold text-white">ORCHESTRATION_ACTIVE</div>
                </div>
            </div>
            
            <div class="panel px-4 py-2 text-right">
                <div class="text-xs text-blue-300">LIVE_AGENTS</div>
                <div class="text-lg font-bold text-yellow-400 text-glow">300</div>
            </div>
        </header>

        <footer class="flex justify-between items-end">
            <div class="panel px-4 py-2 w-1/3">
                <div class="text-[10px] text-blue-400 mb-1 border-b border-blue-900/50 pb-1">EXECUTION_LOG</div>
                <div id="logs" class="text-[10px] text-gray-300 space-y-1 h-20 overflow-hidden flex flex-col justify-end">
                    <!-- Logs populated by JS -->
                </div>
            </div>
            <div class="panel px-4 py-2 flex gap-4">
                <div>
                    <div class="text-[10px] text-blue-400">EPOCH</div>
                    <div class="text-xs text-white">14,092</div>
                </div>
                <div>
                    <div class="text-[10px] text-blue-400">LOSS</div>
                    <div class="text-xs text-green-400">0.0014</div>
                </div>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let layers = [];
        let connections = [];
        
        // Configuration for the Dense Network
        const layerConfigs = [
            { name: "Input", neurons: 35, act: "Linear" },
            { name: "HL 1", neurons: 35, act: "ReLU" },
            { name: "HL 2", neurons: 35, act: "ReLU" },
            { name: "HL 3", neurons: 35, act: "ReLU" },
            { name: "Output", neurons: 20, act: "Sigmoid" }
        ];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
            initNetwork();
        }
        window.addEventListener('resize', resize);

        function initNetwork() {
            layers = [];
            connections = [];
            
            // Determine spacing
            const startX = width * 0.15;
            const endX = width * 0.85;
            const layerSpacing = (endX - startX) / (layerConfigs.length - 1);
            
            // Build Layers and Nodes
            layerConfigs.forEach((config, layerIndex) => {
                const x = startX + (layerIndex * layerSpacing);
                const nodes = [];
                
                // Vertical spacing based on number of neurons
                const startY = height * 0.1;
                const endY = height * 0.95;
                const nodeSpacing = (endY - startY) / (config.neurons - 1);
                
                for (let i = 0; i < config.neurons; i++) {
                    nodes.push({
                        id: `${config.name.charAt(0)}${layerIndex + 1}.${i + 1}`,
                        x: x,
                        y: startY + (i * nodeSpacing),
                        value: Math.random() // For animation
                    });
                }
                
                layers.push({
                    config: config,
                    x: x,
                    startY: startY,
                    nodes: nodes
                });
            });

            // Build Dense Connections (Fully Connected)
            for (let l = 0; l < layers.length - 1; l++) {
                const currentLayer = layers[l].nodes;
                const nextLayer = layers[l+1].nodes;
                
                for (let i = 0; i < currentLayer.length; i++) {
                    for (let j = 0; j < nextLayer.length; j++) {
                        // To improve performance, we might skip a few, but the image is VERY dense.
                        // Let's connect 100% of them for that thick yellow web look.
                        connections.push({
                            from: currentLayer[i],
                            to: nextLayer[j],
                            weight: Math.random(), // 0 to 1
                            phase: Math.random() * Math.PI * 2, // For pulsing animation
                            speed: 0.02 + Math.random() * 0.03
                        });
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            
            // Global composite to make overlapping lines glow intensely
            ctx.globalCompositeOperation = 'screen';
            
            // 1. Draw Connections
            for (let i = 0; i < connections.length; i++) {
                const conn = connections[i];
                
                // Animate weight
                conn.phase += conn.speed;
                const activeWeight = (Math.sin(conn.phase) + 1) / 2; // 0 to 1
                
                // The image has a mix of dark orange and bright yellow lines
                // We map low weight to orange/red, high weight to bright yellow
                const r = 255;
                const g = 100 + (155 * activeWeight); // 100 to 255
                const b = 0;
                
                // Alpha is lower for inactive, higher for active, overall quite low due to density
                const alpha = 0.05 + (activeWeight * 0.15);
                
                ctx.beginPath();
                ctx.moveTo(conn.from.x, conn.from.y);
                ctx.lineTo(conn.to.x, conn.to.y); // Straight lines!
                
                ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            }
            
            ctx.globalCompositeOperation = 'source-over';

            // 2. Draw Layer Info (The text at the top)
            layers.forEach(layer => {
                ctx.fillStyle = 'rgba(20, 40, 80, 0.4)';
                ctx.strokeStyle = 'rgba(50, 100, 200, 0.3)';
                
                // Bounding box for the column headers
                ctx.fillRect(layer.x - 10, layer.startY - 60, 140, 45);
                ctx.strokeRect(layer.x - 10, layer.startY - 60, 140, 45);
                
                ctx.fillStyle = '#60a5fa'; // Tailwind blue-400
                ctx.font = '10px JetBrains Mono';
                ctx.fillText(layer.config.name, layer.x - 5, layer.startY - 45);
                ctx.fillStyle = '#94a3b8'; // Tailwind slate-400
                ctx.fillText(`Neurons: ${layer.config.neurons}`, layer.x - 5, layer.startY - 33);
                ctx.fillText(`Activation: ${layer.config.act}`, layer.x - 5, layer.startY - 21);
            });

            // 3. Draw Nodes
            layers.forEach(layer => {
                layer.nodes.forEach(node => {
                    // Update node value randomly
                    if (Math.random() < 0.05) node.value = Math.random();
                    
                    // Node outer diamond/triangle shape (we use a circle for simplicity but styled like the photo)
                    ctx.beginPath();
                    ctx.arc(node.x, node.y, 4, 0, Math.PI * 2);
                    ctx.fillStyle = '#0f172a'; // dark center
                    ctx.fill();
                    
                    ctx.lineWidth = 1.5;
                    // White/yellow border depending on activation
                    if (node.value > 0.8) {
                        ctx.strokeStyle = '#facc15'; // yellow
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#facc15';
                    } else {
                        ctx.strokeStyle = '#e2e8f0'; // white/grey
                        ctx.shadowBlur = 0;
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0; // reset
                    
                    // Tiny Label next to the node (e.g., H1.1)
                    ctx.fillStyle = '#94a3b8';
                    ctx.font = '9px JetBrains Mono';
                    ctx.fillText(node.id, node.x + 8, node.y + 3);
                });
            });

            requestAnimationFrame(draw);
        }

        // Live Log simulation
        const logsContainer = document.getElementById('logs');
        const logLines = [
            "Agent 042: Analyzing syntax tree in modules/...",
            "Agent 108: Pushing weights to hidden layer 2.",
            "Agent 201: Network routing optimization complete.",
            "System: Loss converging at 0.0014.",
            "Agent 099: Compiling procedural 3D mesh.",
            "Agent 012: Fixing IndentationError at line 42.",
            "System: Re-evaluating execution heuristic.",
        ];

        setInterval(() => {
            const line = document.createElement('div');
            line.innerHTML = `<span class="text-blue-500">[${new Date().toISOString().substring(11, 23)}]</span> ${logLines[Math.floor(Math.random() * logLines.length)]}`;
            logsContainer.appendChild(line);
            if (logsContainer.children.length > 5) {
                logsContainer.removeChild(logsContainer.firstChild);
            }
        }, 1500);

        resize();
        draw();
    </script>
</body>
</html>
