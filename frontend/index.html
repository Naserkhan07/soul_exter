<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="SOUL EXTER — a six-brain LLM trading council on an isometric trading floor." />
    <title>SOUL EXTER · Council Trading Floor</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <style>
      /* paints before the bundle lands, so the first thing you see is the room */
      html, body { margin: 0; height: 100%; background: #04060a; color: #e8eef7;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif; }
      #boot { position: fixed; inset: 0; display: grid; place-items: center; gap: 10px;
        text-align: center; }
      #boot .mark { font-size: 26px; font-weight: 800; letter-spacing: 0.34em; color: #57b6ff; }
      #boot .sub { margin-top: 8px; font-size: 11px; letter-spacing: 0.22em;
        text-transform: uppercase; color: #64748b; }
      #boot .dots { margin-top: 18px; display: flex; gap: 6px; justify-content: center; }
      #boot .dots i { width: 6px; height: 6px; border-radius: 50%; background: #1e293b;
        animation: pulse 1.2s ease-in-out infinite; }
      #boot .dots i:nth-child(2) { animation-delay: 0.15s; }
      #boot .dots i:nth-child(3) { animation-delay: 0.3s; }
      #boot .dots i:nth-child(4) { animation-delay: 0.45s; }
      @keyframes pulse { 0%, 100% { background: #1e293b; } 50% { background: #57b6ff; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div>
        <div class="mark">SOUL EXTER</div>
        <div class="sub">starting the floor</div>
        <div class="dots"><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
    <script>
      // the splash goes away as soon as react paints
      new MutationObserver((_, obs) => {
        const root = document.getElementById("root");
        const boot = document.getElementById("boot");
        if (root && root.childElementCount > 0 && boot) { boot.remove(); obs.disconnect(); }
      }).observe(document.getElementById("root"), { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
