services:
  shorts-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CHANNEL_CONFIG_FILE: /app/credentials/channels.toml
      YOUTUBE_CLIENT_SECRETS_FILE: /app/credentials/client_secret.json
      YOUTUBE_TOKEN_FILE: /app/credentials/youtube_token.json
    volumes:
      - ./work:/app/work
      - ./credentials:/app/credentials

  link-queue:
    build: .
    restart: unless-stopped
    command: ["shorts-queue"]
    env_file: .env
    environment:
      CHANNEL_CONFIG_FILE: /app/credentials/channels.toml
      YOUTUBE_CLIENT_SECRETS_FILE: /app/credentials/client_secret.json
      YOUTUBE_TOKEN_FILE: /app/credentials/youtube_token.json
      LINKS_FILE: /app/links.txt
    volumes:
      - ./work:/app/work
      - ./credentials:/app/credentials
      - ./links.txt:/app/links.txt
