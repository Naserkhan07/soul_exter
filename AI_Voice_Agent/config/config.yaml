# =============================================================
#  AI Voice Agent — configuration
#
#  PRIMARY BRAIN: Qwen Omni (Speech-to-Speech) on a FREE Kaggle GPU.
#  One model hears the person and speaks the reply — it handles BOTH the
#  thinking and the voice. No Groq, no paid provider needed.
#
#  To go live:
#   1) Start scripts/kaggle/qwen_omni_server.ipynb on Kaggle (GPU T4 x2),
#   2) copy the tunnel URL it prints into  sts.qwen_kaggle.url  below,
#   3) run  python run.py  -> START.
# =============================================================

agent:
  name: "AI_Voice_Agent"
  task: "my_business"          # folder under ./tasks/ (e.g. default, my_business)
  identity:
    name: "Naveed"             # the agent's name (used in the Start greeting)
    greeting: "Hi, I'm {name}."   # said when you press Start, before the opening
  language: "auto"             # "auto" = detect from the person's speech each turn
  fallback_language: "en"
  reply_style: "conversational" # conversational | terse | helpful
  max_turns: 1000
  log_dir: "logs"
  data_dir: "data"

# ---------------- Speech-to-Speech (THE brain) ---------------
# A single Qwen Omni model takes the person's speech in and speaks the reply
# out — no separate STT/LLM/TTS. Runs on a free Kaggle GPU (scripts/kaggle/).
#
#   provider: "qwen_kaggle" -> Qwen Omni on a free Kaggle GPU (DEFAULT). Set
#                              the tunnel URL below after starting the notebook.
#   provider: "qwen_omni"   -> Qwen Omni on your own GPU server.
#   provider: "mock"        -> fully offline test (no audio/GPU/keys).
sts:
  provider: "qwen_kaggle"
  qwen_omni:
    url: "http://127.0.0.1:8501/sts"   # local Qwen server endpoint
  qwen_kaggle:
    url: ""                            # <-- PASTE your Kaggle tunnel URL here
    model: "Qwen/Qwen2.5-Omni-3B"      # NOTE: no "-Instruct" suffix (that ID doesn't exist)

# ---------------- Speech-to-Text (optional fallback) ----------
# Used when sts.provider is NOT qwen (i.e. the three-stage "Gemini hears ->
# thinks -> Edge speaks" pipeline below). With Qwen as the brain these are
# ignored. No Groq.
#
#   provider: "gemini"  -> FREE Google Gemini audio understanding (very good at
#                          hearing/listening, many languages). Set keys.gemini
#                          to a free key from https://aistudio.google.com/apikey
#                          and switch sts.provider to "mock" to activate this.
#   provider: "openai" (whisper-1), "deepgram" (nova-3) | offline: "mock"
stt:
  provider: "mock"
  gemini:
    model: "gemini-1.5-flash"   # free tier supports audio input
    mime_type: "audio/wav"      # what the capture produces
    language: ""                # optional: force a language, e.g. "hi" / "en"
  openai:
    model: "whisper-1"
    language: null               # null = auto
  deepgram:
    model: "nova-3"
    smart_format: true
    language: null

# ---------------- Language model (optional fallback) ----------
# Used ONLY by the old three-stage pipeline or text mode. With Qwen as the
# brain (sts) these are ignored. No Groq.
# free: "gemini" (gemini-1.5-flash)  | paid: "openai" | offline: "mock"
llm:
  provider: "mock"
  temperature: 0.6
  max_tokens: 300
  openai:
    model: "gpt-4o-mini"
    base_url: "https://api.openai.com/v1"
  gemini:
    model: "gemini-1.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/models"

# ---------------- Text-to-Speech (greeting only) --------------
# Only the Start greeting / opening line use TTS (Qwen replies come back as
# audio already). Free, keyless Microsoft Edge voices in many languages.
tts:
  provider: "edge"
  openai:
    model: "gpt-4o-mini-tts"
    voice: "alloy"              # alloy|echo|fable|onyx|nova|shimmer
    output_format: "mp3"
  elevenlabs:
    voice: "Rachel"
    model: "eleven_multilingual_v2"   # best multilingual quality
  edge:
    voice: "en-US-AriaNeural"    # pick per language at runtime when auto
    rate: "+0%"

# ---------------- Audio (real microphone/speaker on your PC) -
audio:
  input:
    capture: "device"            # how the agent HEARS the person:
                                 #   "device"          = read from a microphone /
                                 #     input device (id below, or null = system
                                 #     default input). USE THIS to hear a real
                                 #     phone call through your laptop's mic.
                                 #   "system_loopback" = record what the system
                                 #     is playing (only hears audio INSIDE the
                                 #     PC — e.g. WhatsApp Desktop / songs / calls
                                 #     on the PC itself). Will NOT hear a physical
                                 #     phone held near the laptop.
    device: null                 # input device id from the startup AUDIO list
                                 # (e.g. 13 = Realtek Mic Array, 5 = Microphone
                                 # Array). null = Windows default recording device.
    sample_rate: 16000
    channels: 1
    chunk_ms: 30
  output:
    device: null                 # USB audio device the AGENT speaks into the
                                 # phone call (set its id via --list-audio)
    sample_rate: 24000
  vad:
    provider: "energy"           # "energy" (built-in) | "silero" (more accurate)
    energy_threshold: 0.02       # RMS threshold in [-1,1] — 0.02 works for a
                                 # call; raise if it picks up noise, lower if it
                                 # misses soft speech
    min_speech_ms: 350
    silence_pad_ms: 300
    min_silence_ms: 800          # end-of-speech detection
  barge_in:
    enabled: true                # stop talking when the person interrupts
    sensitivity: 0.55

# ---------------- Phone bridge -------------------------------
# "You dial, the agent talks" free workflow:
#   bridge: "loopback"  -> capture whatever the system is playing (works with
#                          any call app), speak through your USB/speaker device.
#   bridge: "none"      -> local mic + speaker (test, no phone).
#   bridge: "audio"     -> physical phone via a USB audio interface.
phone:
  bridge: "loopback"
  twilio:
    account_sid: ""
    auth_token: ""
    from_number: ""
  sip:
    domain: ""
    user: ""
    password: ""

# ---------------- Memory --------------------------------------
memory:
  type: "json"                   # json (simple, v1) | sqlite (later)
  max_context_turns: 12          # most recent turns sent to the model
  summarize_after: 30            # turns before we start summarising
  persist: true                  # save each call transcript to data/conversations

# ---------------- Model keys (also loaded from .env) ---------
# Qwen on Kaggle needs NO API key (just the tunnel URL in sts.qwen_kaggle.url).
# Edge TTS needs no key. The other keys below are only for the optional paid/
# free non-Qwen fallbacks.
keys:
  gemini: ""                     # FREE Gemini key (aistudio.google.com/apikey) -
                                 # used for hearing (stt.gemini) and/or thinking (llm.gemini)
  openai: ""
  deepgram: ""
  elevenlabs: ""
  qwen_url: ""                   # Kaggle Qwen STS tunnel URL (same as sts.qwen_kaggle.url)
